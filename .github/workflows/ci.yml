name: 01 - Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  structure:
    name: Project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check README and required files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md || { echo "README.md is empty"; exit 1; }
          required_files=(
            app.py
            vercel.json
            .python-version
            requirements.txt
            requirements-dev.txt
            CLAUDE.md
            .gitignore
            .vercelignore
            .pylintrc
            .github/workflows/ci.yml
          )
          missing=0
          for file_path in "${required_files[@]}"; do
            if [ ! -f "$file_path" ]; then
              echo "Missing required file: $file_path"
              missing=1
            fi
          done
          test -d tests || { echo "Missing tests directory"; missing=1; }
          exit $missing

      - name: Check secrets are ignored and not tracked
        shell: bash
        run: |
          set -euo pipefail
          grep -qx ".env" .gitignore || { echo ".env is not in .gitignore"; exit 1; }
          grep -qx ".env" .vercelignore || { echo ".env is not in .vercelignore"; exit 1; }
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env is tracked by git"
            exit 1
          fi

      - name: Check Vercel configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"maxDuration"' vercel.json || { echo "maxDuration missing in vercel.json"; exit 1; }
          grep -q '"app.py"' vercel.json || { echo "vercel.json must configure app.py"; exit 1; }
          grep -qx "3.13" .python-version || { echo ".python-version must be 3.13"; exit 1; }

      - name: Check dependencies are pinned
        shell: bash
        run: |
          set -euo pipefail
          unpinned=$(grep -vE '^\s*(#|$|-r )' requirements.txt | grep -v '==' || true)
          if [ -n "$unpinned" ]; then
            echo "Unpinned dependencies in requirements.txt:"
            echo "$unpinned"
            exit 1
          fi

      - name: Check every agent folder has its files and tests
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for agent_dir in agents/*/; do
            agent_name=$(basename "$agent_dir")
            [ "$agent_name" = "__pycache__" ] && continue
            for file_name in config.py agent.py; do
              if [ ! -f "${agent_dir}${file_name}" ]; then
                echo "Agent $agent_name is missing $file_name"
                status=1
              fi
            done
            if [ ! -f "tests/agents/test_${agent_name}.py" ]; then
              echo "Agent $agent_name has no tests/agents/test_${agent_name}.py"
              status=1
            fi
          done
          exit $status

  lint:
    name: Lint (pylint)
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run pylint
        run: python -m pylint server agents app.py tests

  unit-test:
    name: Unit tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=server \
            --cov=agents \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=junit-unit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            junit-unit.xml
            coverage.xml

  security:
    name: Security (bandit, pip-audit, gitleaks)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run bandit on application code
        run: python -m bandit -r server agents app.py -ll

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner=off

      - name: Scan git history for secrets (gitleaks)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose --no-banner

  test-report:
    name: Test report
    needs: [structure, lint, unit-test, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write job summary
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Structure | ${{ needs.structure.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Unit tests | ${{ needs.unit-test.result }} |"
            echo "| Security | ${{ needs.security.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-success:
    name: Pipeline success
    needs: [structure, lint, unit-test, security, test-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ needs.structure.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "At least one job failed."
            exit 1
          fi
